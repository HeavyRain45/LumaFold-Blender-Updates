name: Build LumaFold 0.8.49 Mode Sync V7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lumafold-0849-mode-sync-v7.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Patch V6 with event-driven Satellite mode acknowledgement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'patch_v7.py'
          @'
          import hashlib
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path.cwd()
          source = root / "manual" / "candidates" / "lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v6.zip"
          output = root / "manual" / "candidates" / "lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v7.zip"
          sha_file = output.with_suffix(output.suffix + ".sha256.txt")
          work = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "lumafold_v7_stage"

          if not source.is_file():
              raise SystemExit(f"source candidate missing: {source}")
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          with zipfile.ZipFile(source, "r") as zf:
              zf.extractall(work)

          # The mode switch itself is already synchronous for Satellite in V5.
          # Replace its heavy post-command snapshot with a tiny committed-mode ack.
          bridge = work / "desktop" / "bridge_server.py"
          text = bridge.read_text(encoding="utf-8").replace("\r\n", "\n")
          cmd_start = text.index('        if action == "command":')
          gate_start = text.index(
              '            if (not satellite_client) or command_id in {"sculpt.enter", "sculpt.exit_to_object"}:',
              cmd_start,
          )
          gate_return = text.index("            return response", gate_start)
          new_gate = (
              '            if satellite_client and command_id in {"sculpt.enter", "sculpt.exit_to_object"}:\n'
              '                # A mode command is special: Satellite cannot infer Blender mode,\n'
              '                # but a full snapshot would run Brush/Alpha sync on the main thread.\n'
              '                # The synchronous mode command has already refreshed APP context,\n'
              '                # so acknowledge only the committed mode/status needed to redraw.\n'
              '                context = APP.state.context\n'
              '                sculpt_status = APP.modules.status("sculpt")\n'
              '                workspace_name = ""\n'
              '                try:\n'
              '                    workspace_name = str(getattr(getattr(bpy.context.window, "workspace", None), "name", "") or "")\n'
              '                except Exception:\n'
              '                    pass\n'
              '                response["state"] = {\n'
              '                    "sculpt_status": {\n'
              '                        "active": bool(sculpt_status.active),\n'
              '                        "enabled": bool(sculpt_status.enabled),\n'
              '                        "reason": str(sculpt_status.reason or ""),\n'
              '                        "mode": str(context.mode or ""),\n'
              '                        "workspace": workspace_name,\n'
              '                    },\n'
              '                }\n'
              '            elif not satellite_client:\n'
              '                response["state"] = self._snapshot(self.client_name)\n'
          )
          text = text[:gate_start] + new_gate + text[gate_return:]
          bridge.write_text(text, encoding="utf-8", newline="\n")

          # Immediately latch Blender truth after a successful Satellite mode command,
          # before the final wire postcondition is enforced. This removes dependence
          # on the 10 Hz truth timer and closes the exact stale-OBJECT race.
          auth = work / "runtime" / "satellite_bridge_authority.py"
          atext = auth.read_text(encoding="utf-8").replace("\r\n", "\n")
          proc_start = atext.index("    def process_authority(payload):")
          proc_end = atext.index("    bridge._snapshot = snapshot_authority", proc_start)
          new_auth = (
              '    def process_authority(payload):\n'
              '        response = _ORIGINAL_PROCESS(payload)\n'
              '        client = str((payload or {}).get("client") or bridge.client_name or "")\n'
              '        if (\n'
              '            client.startswith("LumaFold Satellite")\n'
              '            and str((payload or {}).get("action") or "") == "command"\n'
              '            and str((payload or {}).get("command_id") or "") in {"sculpt.enter", "sculpt.exit_to_object"}\n'
              '            and isinstance(response, dict)\n'
              '            and bool(response.get("ok"))\n'
              '        ):\n'
              '            # The mode command has committed on Blender\'s main thread.\n'
              '            # Latch truth now; never wait for the periodic truth timer.\n'
              '            publish_context_truth(None)\n'
              '        return _enforce_satellite_wire_truth(response, client)\n'
              '\n'
          )
          atext = atext[:proc_start] + new_auth + atext[proc_end:]
          auth.write_text(atext, encoding="utf-8", newline="\n")

          compile(bridge.read_text(encoding="utf-8"), str(bridge), "exec")
          compile(auth.read_text(encoding="utf-8"), str(auth), "exec")

          # Preserve bounded accepted behavior.
          panels = (work / "panels.py").read_text(encoding="utf-8")
          if 'row.menu("LUMAFOLD_MT_product_maintenance"' in panels:
              raise SystemExit("hidden top-right dropdown regressed")
          satellite = (work / "desktop" / "satellite_host.py").read_text(encoding="utf-8")
          handoff_slice = satellite[satellite.index("def _wndproc_with_shortcut_capture"):satellite.index("if int(msg) == int(_runtime.WM_APP_SHOW)")]
          if '_runtime.actions.put({"action": "get_state"})' in handoff_slice:
              raise SystemExit("first-stroke bounded fix regressed")
          sculpt_core = (work / "runtime" / "sculpt_input_core.py").read_text(encoding="utf-8")
          if 'if _host_mode() == "satellite":' not in sculpt_core:
              raise SystemExit("synchronous Satellite mode transition lost")
          service = (work / "services" / "blender.py").read_text(encoding="utf-8")
          if 'object_mode == "SCULPT"' not in service:
              raise SystemExit("V6 object-mode truth fix lost")
          launcher = (work / "desktop" / "launcher.py").read_text(encoding="utf-8")
          if "_active_slimgui_import_root" not in launcher:
              raise SystemExit("bundled Satellite runtime launch fix lost")
          manifest = (work / "blender_manifest.toml").read_text(encoding="utf-8")
          if 'wheels/slimgui-0.8.2-cp312-abi3-win_amd64.whl' not in manifest:
              raise SystemExit("bundled slimgui manifest entry lost")
          if not (work / "wheels" / "slimgui-0.8.2-cp312-abi3-win_amd64.whl").is_file():
              raise SystemExit("bundled slimgui wheel lost")

          output.unlink(missing_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(work.rglob("*")):
                  if item.is_file():
                      zf.write(item, item.relative_to(work).as_posix())

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          sha_file.write_text(f"{digest}  {output.name}\n", encoding="utf-8")
          print(f"Built {output} ({output.stat().st_size} bytes)")
          print(f"SHA256 {digest}")
          '@ | Set-Content -Path $script -Encoding UTF8
          python $script

      - name: Blender 5.2 mode-truth and transport gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path "$PWD/manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v7.zip").Path

          # Static transport contract: Satellite mode commands must return only a
          # lightweight committed-mode state, never the full Brush/Alpha snapshot.
          $stage = Join-Path $env:RUNNER_TEMP 'lumafold-v7-contract'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -Path $package -DestinationPath $stage -Force
          $contract = Join-Path $env:RUNNER_TEMP 'check_v7_contract.py'
          @'
          import pathlib

          root = pathlib.Path(r'''__STAGE__''')
          bridge = (root / "desktop" / "bridge_server.py").read_text(encoding="utf-8")
          auth = (root / "runtime" / "satellite_bridge_authority.py").read_text(encoding="utf-8")
          core = (root / "runtime" / "sculpt_input_core.py").read_text(encoding="utf-8")
          service = (root / "services" / "blender.py").read_text(encoding="utf-8")

          assert 'satellite_client and command_id in {"sculpt.enter", "sculpt.exit_to_object"}' in bridge
          mode_branch = bridge.split('satellite_client and command_id in {"sculpt.enter", "sculpt.exit_to_object"}', 1)[1].split('elif not satellite_client:', 1)[0]
          assert 'self._snapshot(' not in mode_branch
          assert '"mode": str(context.mode or "")' in mode_branch

          assert 'publish_context_truth(None)' in auth
          assert 'return _enforce_satellite_wire_truth(response, client)' in auth
          assert 'if _host_mode() == "satellite":' in core
          assert 'run()' in core.split('if _host_mode() == "satellite":', 1)[1].split('try:', 1)[0]
          assert 'object_mode == "SCULPT"' in service
          print("LUMAFOLD_V7_TRANSPORT_CONTRACT_OK")
          '@ | Set-Content -Path $contract -Encoding UTF8
          (Get-Content $contract -Raw).Replace('__STAGE__', $stage.Replace('\','\\')) | Set-Content $contract -Encoding UTF8
          python $contract
          if ($LASTEXITCODE -ne 0) { throw "V7 transport contract failed" }

          # Real Blender truth check. This deliberately avoids sculpt_input_core
          # in --background because that module imports Blender GPU APIs that are
          # only valid with a graphics context. The command/transport path above
          # is syntax/contract checked; Blender truth itself is exercised here.
          foreach ($version in @('5.2.2')) {
            $archive = Join-Path $env:RUNNER_TEMP "blender-$version-windows-x64.zip"
            $blenderRoot = Join-Path $env:RUNNER_TEMP "blender-$version"
            if (Test-Path $blenderRoot) { Remove-Item $blenderRoot -Recurse -Force }
            curl.exe -L --fail --retry 3 --retry-delay 2 "https://download.blender.org/release/Blender5.2/blender-$version-windows-x64.zip" -o $archive
            if ($LASTEXITCODE -ne 0) { throw "Blender $version download failed" }
            Expand-Archive -Path $archive -DestinationPath $blenderRoot -Force
            $exe = Get-ChildItem -Path $blenderRoot -Filter blender.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Blender $version executable not found" }

            & $exe.FullName --command extension validate $package
            if ($LASTEXITCODE -ne 0) { throw "Blender $version extension validation failed" }

            $probeRoot = Join-Path $env:RUNNER_TEMP "lumafold-v7-probe-$version"
            if (Test-Path $probeRoot) { Remove-Item $probeRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
            Expand-Archive -Path $package -DestinationPath $probeRoot -Force
            $probe = Join-Path $env:RUNNER_TEMP "probe-mode-truth-v7-$version.py"
            @"
          import pathlib
          import sys
          import types
          import bpy

          root = pathlib.Path(r'''$probeRoot''').resolve()
          package = types.ModuleType("lumafold")
          package.__path__ = [str(root)]
          package.__package__ = "lumafold"
          sys.modules["lumafold"] = package
          for sub in ("core", "services", "runtime", "desktop", "modules"):
              mod = types.ModuleType("lumafold." + sub)
              mod.__path__ = [str(root / sub)]
              mod.__package__ = "lumafold." + sub
              sys.modules["lumafold." + sub] = mod

          bpy.ops.mesh.primitive_uv_sphere_add()
          obj = bpy.context.view_layer.objects.active
          bpy.ops.object.mode_set(mode='SCULPT')
          assert obj.mode == 'SCULPT', obj.mode

          from lumafold.services.blender import BlenderContextService
          snap = BlenderContextService.snapshot(host_id='embedded')
          assert snap.mode == 'SCULPT', f'embedded truth={snap.mode!r}'

          from lumafold.runtime import satellite_bridge_authority as authority
          sat_mode = authority._context_mode(bpy.context)
          assert sat_mode == 'SCULPT', f'satellite truth={sat_mode!r}'
          print('LUMAFOLD_V7_BLENDER_TRUTH_OK', obj.mode, snap.mode, sat_mode)
          "@ | Set-Content -Path $probe -Encoding UTF8

            & $exe.FullName --background --factory-startup --python $probe
            if ($LASTEXITCODE -ne 0) { throw "Blender $version mode-truth probe failed" }
          }

      - name: Publish verified V7 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'LumaFold Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v7.zip
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v7.zip.sha256.txt
          git commit -m "candidate: exact Satellite Sculpt mode acknowledgement"
          git push origin HEAD:main
