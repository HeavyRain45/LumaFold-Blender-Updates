name: Build LumaFold 0.8.49 V33 Satellite Sculpt Reflow Slot Ack

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-lumafold-0849-v33-satellite-sculpt-reflow-slot-ack.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Patch V32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = Join-Path $env:RUNNER_TEMP 'v33.py'
          @'
          import pathlib, zipfile, shutil, hashlib, os

          root = pathlib.Path.cwd()
          src = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v32-preserve-hidden-quick-brushes.zip'
          out = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v33-satellite-sculpt-reflow-slot-ack.zip'
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'lf_v33'
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          with zipfile.ZipFile(src) as z:
              z.extractall(work)

          # ==============================================================
          # A) Object -> Sculpt Satellite geometry epoch
          #
          # V30 split popup placement from Primary layout measurement:
          #   sculpt_brush_library_anchor  -> popup placement only
          #   sculpt_primary_bottom_anchor -> Primary bottom geometry truth
          #
          # primary_geometry_session still read the old popup key, so its
          # explicit Object->Sculpt visible re-calibration could never find a
          # valid bottom anchor. That left the Sculpt product clipped at the
          # shorter pre-Sculpt/native host height until a manual row change
          # happened to rebase the window.
          # ==============================================================
          geom = work/'desktop/primary_geometry_session.py'
          g = geom.read_text(encoding='utf-8').replace('\r\n','\n')

          old_anchor = '        anchor = dict(runtime.surface_state.get("sculpt_brush_library_anchor") or {})\n'
          new_anchor = '''        # Primary geometry must use the dedicated layout metric. Popup
                  # placement is intentionally independent since V30.
                  anchor = dict(runtime.surface_state.get("sculpt_primary_bottom_anchor") or {})
          '''
          if old_anchor not in g:
              raise SystemExit('primary geometry session still-new anchor block not found')
          g = g.replace(old_anchor, new_anchor, 1)
          compile(g, str(geom), 'exec')
          geom.write_text(g, encoding='utf-8', newline='\n')

          # ==============================================================
          # B) Satellite Quick Brush mutations need an immediate visual ACK
          #
          # Satellite is intentionally event-driven and does not idle-poll
          # Blender. Most clicks are optimistic, but slot-content commands
          # cannot be reconstructed locally because Blender is authoritative
          # for the final Brush Asset identity/label.
          #
          # These mutations therefore return the compact visual snapshot in
          # the same command response. The Satellite network worker already
          # consumes response["state"] synchronously.
          # ==============================================================
          bridge = work/'desktop/bridge_server.py'
          b = bridge.read_text(encoding='utf-8').replace('\r\n','\n')

          old_special = '''            if command_id == "sculpt.brush.library_replace_slot":
                      response["state"] = self._sculpt_visual_state()
                  elif satellite_client and command_id in {"sculpt.enter", "sculpt.exit_to_object"}:
          '''
          new_special = '''            if command_id in {
                      "sculpt.brush.library_replace_slot",
                      "sculpt.brush.library_assign_slot",
                      "sculpt.brush.assign_current_to_slot",
                      "sculpt.brush.clear_slot",
                      "sculpt.brush.reset_quick_slots",
                  }:
                      # Slot-content mutations are not safely optimistic: Blender
                      # owns the canonical Brush Asset identity and final label.
                      # Return the compact visual state immediately so Satellite
                      # does not remain stale until a Host re-entry snapshot.
                      response["state"] = self._sculpt_visual_state()
                  elif satellite_client and command_id in {"sculpt.enter", "sculpt.exit_to_object"}:
          '''
          if old_special not in b:
              raise SystemExit('bridge slot visual ACK branch not found')
          b = b.replace(old_special, new_special, 1)
          compile(b, str(bridge), 'exec')
          bridge.write_text(b, encoding='utf-8', newline='\n')

          # ==============================================================
          # Regression gates
          # ==============================================================
          runtime = (work/'desktop/satellite_host_runtime.py').read_text(encoding='utf-8')
          sat_host = (work/'desktop/satellite_host.py').read_text(encoding='utf-8')
          authority = (work/'runtime/satellite_bridge_authority.py').read_text(encoding='utf-8')
          visual = (work/'runtime/primary_visual_assets.py').read_text(encoding='utf-8')
          foundation = (work/'ui/sculpt_view_foundation.py').read_text(encoding='utf-8')
          view = (work/'ui/sculpt_view.py').read_text(encoding='utf-8')
          session = (work/'desktop/secondary_surface_session.py').read_text(encoding='utf-8')
          secondary = (work/'desktop/secondary_surface_host.py').read_text(encoding='utf-8')
          nav = (work/'runtime/sculpt_navigation.py').read_text(encoding='utf-8')
          pointer = (work/'runtime/sculpt_native_pointer.py').read_text(encoding='utf-8')
          mask = (work/'runtime/sculpt_mask_gesture.py').read_text(encoding='utf-8')
          route = (work/'runtime/sculpt_route_truth.py').read_text(encoding='utf-8')

          # V33 Object->Sculpt layout epoch must consume the V30 geometry key.
          assert 'surface_state.get("sculpt_primary_bottom_anchor")' in g
          assert 'surface_state.get("sculpt_brush_library_anchor")' not in g
          assert 'runtime._primary_geometry_ready = False' in g
          assert '_RECALIBRATE_VISIBLE = bool(runtime.visible)' in g
          assert 'runtime._primary_resize_pending = True' in g

          # V33 slot-content commands return immediate compact visual state.
          for cmd in (
              'sculpt.brush.library_replace_slot',
              'sculpt.brush.library_assign_slot',
              'sculpt.brush.assign_current_to_slot',
              'sculpt.brush.clear_slot',
              'sculpt.brush.reset_quick_slots',
          ):
              assert f'"{cmd}"' in b
          assert 'response["state"] = self._sculpt_visual_state()' in b
          assert 'snapshot = response.get("state")' in sat_host
          assert '_runtime._sync_local_from_snapshot(snapshot)' in sat_host

          # V32 hidden slot + preview preservation remains.
          assert '"fields": {"quick_brush_slots": slot_snapshot}' in runtime
          assert 'for slot in slots[:16]:' in visual
          assert 'for slot in slots[:16]:' in authority
          assert 'visible = slots[: min(len(slots), 16)]' in view

          # V31 live row resize remains.
          qstart = runtime.index('def _queue_quick_rows(rows):')
          qend = runtime.index('\n\ndef _secondary_log_path', qstart)
          qb = runtime[qstart:qend]
          assert 'current_rows = clamp_quick_rows(local_sculpt.get("quick_rows", 2))' in qb
          assert 'user32.GetClientRect(hwnd_main' in qb
          assert '_primary_base_height_design = normalize_base_height_design(' in qb
          assert 'set_exact_client_size(hwnd_main, target_w, target_h)' in runtime
          assert '_apply_rounded_window_region(hwnd_main)' in runtime

          # V30 metric split remains.
          assert 'surface_state["sculpt_primary_bottom_anchor"] = dict(brush_anchor)' in foundation

          # V29 Secondary open-only remains.
          assert 'def _toggle_secondary_surface(kind="brush_library", anchor=None, *, open_only=False):' in runtime
          assert 'runtime._toggle_secondary_surface(kind, anchor, open_only=True)' in session

          # V27/V28 Quick Brush first-click + native Shift snap remain.
          assert 'pressed_preview = False' in view
          assert 'imgui_arg.is_mouse_clicked(0)' in view
          assert '_open_targeted_library(int(ident)' in view
          assert 'def invoke_blender_rotate(target) -> bool:' in nav
          assert 'AXIS_SNAP_ENABLE' in nav and 'AXIS_SNAP_DISABLE' in nav
          assert 'LEFT_SHIFT' in nav and 'RIGHT_SHIFT' in nav
          assert 'getattr(navigation, "invoke_blender_rotate", None)' in pointer

          # Preserve preview / Mask / first-stroke chain.
          assert 'on_request_preview=_request_brush_previews_exact' in secondary
          assert '_BRUSH_PREVIEW_QUEUE_LIMIT = 4' in secondary
          assert 'clean_age >= 0.18' in secondary
          assert '_CLASSES = (LUMAFOLD_OT_sculpt_mask_gesture_v2,)' in mask
          assert 'satellite_pointer_guard' in route
          assert 'satellite_client_pointer_reprime' in sat_host

          for py in work.rglob('*.py'):
              compile(py.read_text(encoding='utf-8'), str(py), 'exec')

          out.unlink(missing_ok=True)
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for file in sorted(work.rglob('*')):
                  if file.is_file():
                      z.write(file, file.relative_to(work).as_posix())

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_suffix(out.suffix+'.sha256.txt').write_text(
              f'{digest}  {out.name}\n', encoding='utf-8'
          )
          print('SHA256', digest)
          '@ | Set-Content $py -Encoding UTF8
          python $py

      - name: Blender 5.2.0 and 5.2.2 extension validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Resolve-Path "$PWD/manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v33-satellite-sculpt-reflow-slot-ack.zip").Path
          foreach ($v in @('5.2.0','5.2.2')) {
            $z = Join-Path $env:RUNNER_TEMP "blender-$v.zip"
            $d = Join-Path $env:RUNNER_TEMP "blender-$v"
            curl.exe -L --fail --retry 3 "https://download.blender.org/release/Blender5.2/blender-$v-windows-x64.zip" -o $z
            if ($LASTEXITCODE -ne 0) { throw "Blender $v download failed" }
            Expand-Archive $z $d -Force
            $exe = Get-ChildItem $d -Filter blender.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Blender $v executable missing" }
            & $exe.FullName --command extension validate $pkg
            if ($LASTEXITCODE -ne 0) { throw "Blender $v validation failed" }
          }

      - name: Publish
        shell: pwsh
        run: |
          git config user.name 'LumaFold Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v33-satellite-sculpt-reflow-slot-ack.zip*
          git commit -m "candidate: fix Satellite Sculpt reflow and Quick Brush slot ACK"
          git push origin HEAD:main
