name: Build LumaFold 0.8.49 Mode Truth V6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lumafold-0849-mode-truth-v6.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Patch V5 candidate with narrow Blender mode-truth fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'patch_v6.py'
          @'
          import hashlib
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path.cwd()
          source = root / "manual" / "candidates" / "lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v5.zip"
          output = root / "manual" / "candidates" / "lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v6.zip"
          sha_file = output.with_suffix(output.suffix + ".sha256.txt")
          work = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "lumafold_v6_stage"

          if not source.is_file():
              raise SystemExit(f"source candidate missing: {source}")
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          with zipfile.ZipFile(source, "r") as zf:
              zf.extractall(work)

          # Embedded truth: bpy.context.mode can lag in draw/timer contexts after
          # a successful Sculpt transition. For the single SCULPT case only,
          # prefer the active Blender object's own mode.
          service = work / "services" / "blender.py"
          text = service.read_text(encoding="utf-8").replace("\r\n", "\n")
          old = '''    @staticmethod
              def snapshot(host_id: str = "embedded") -> ContextSnapshot:
                  import bpy
                  obj = bpy.context.view_layer.objects.active
                  return ContextSnapshot(
                      mode=str(getattr(bpy.context, "mode", "UNKNOWN")),
          '''
          new = '''    @staticmethod
              def snapshot(host_id: str = "embedded") -> ContextSnapshot:
                  import bpy
                  obj = bpy.context.view_layer.objects.active
                  context_mode = str(getattr(bpy.context, "mode", "") or "")
                  object_mode = str(getattr(obj, "mode", "") or "") if obj is not None else ""
                  # Real-machine 5.2 can expose a stale OBJECT context mode for
                  # one UI path even after Blender has visibly entered Sculpt.
                  # Object.mode is Blender-owned truth for this narrow case.
                  mode = "SCULPT" if object_mode == "SCULPT" else (context_mode or object_mode or "UNKNOWN")
                  return ContextSnapshot(
                      mode=mode,
          '''
          if text.count(old) != 1:
              raise SystemExit(f"BlenderContextService snapshot marker count={text.count(old)}")
          text = text.replace(old, new, 1)
          service.write_text(text, encoding="utf-8", newline="\n")

          # Satellite truth cache has the same stale-OBJECT hazard. Resolve an
          # active object's SCULPT mode before accepting context.mode=OBJECT.
          authority = work / "runtime" / "satellite_bridge_authority.py"
          atext = authority.read_text(encoding="utf-8").replace("\r\n", "\n")
          start = atext.index("def _context_mode(context) -> str:")
          end = atext.index("\ndef _context_workspace(", start)
          replacement = '''def _context_mode(context) -> str:
              """Resolve Blender-owned mode, preferring active Sculpt object truth."""
              if context is None:
                  return ""

              # Some Blender timer/draw contexts transiently retain context.mode ==
              # OBJECT after the active object has already entered Sculpt. Do not
              # let that stale generic value overwrite visible Blender truth.
              for name in ("sculpt_object", "object", "active_object"):
                  try:
                      obj = getattr(context, name, None)
                      value = str(getattr(obj, "mode", "") or "")
                      if value == "SCULPT":
                          return "SCULPT"
                  except Exception:
                      pass

              try:
                  value = str(getattr(context, "mode", "") or "")
                  if value:
                      return value
              except Exception:
                  pass

              for name in ("object", "active_object"):
                  try:
                      obj = getattr(context, name, None)
                      value = str(getattr(obj, "mode", "") or "")
                      if value:
                          return value
                  except Exception:
                      pass
              return ""


          '''
          atext = atext[:start] + replacement + atext[end:]
          authority.write_text(atext, encoding="utf-8", newline="\n")

          compile(service.read_text(encoding="utf-8"), str(service), "exec")
          compile(authority.read_text(encoding="utf-8"), str(authority), "exec")

          # Preserve all previous bounded behavior.
          panels = (work / "panels.py").read_text(encoding="utf-8")
          if 'row.menu("LUMAFOLD_MT_product_maintenance"' in panels:
              raise SystemExit("hidden top-right dropdown regressed")
          satellite = (work / "desktop" / "satellite_host.py").read_text(encoding="utf-8")
          handoff_slice = satellite[satellite.index("def _wndproc_with_shortcut_capture"):satellite.index("if int(msg) == int(_runtime.WM_APP_SHOW)")]
          if '_runtime.actions.put({"action": "get_state"})' in handoff_slice:
              raise SystemExit("first-stroke bounded fix regressed")
          bridge = (work / "desktop" / "bridge_server.py").read_text(encoding="utf-8")
          if 'command_id in {"sculpt.enter", "sculpt.exit_to_object"}' not in bridge:
              raise SystemExit("V5 one-shot mode response lost")
          sculpt_core = (work / "runtime" / "sculpt_input_core.py").read_text(encoding="utf-8")
          if 'if _host_mode() == "satellite":' not in sculpt_core:
              raise SystemExit("V5 synchronous Satellite mode transition lost")
          launcher = (work / "desktop" / "launcher.py").read_text(encoding="utf-8")
          if "_active_slimgui_import_root" not in launcher:
              raise SystemExit("bundled Satellite runtime launch fix lost")
          manifest = (work / "blender_manifest.toml").read_text(encoding="utf-8")
          if 'wheels/slimgui-0.8.2-cp312-abi3-win_amd64.whl' not in manifest:
              raise SystemExit("bundled slimgui manifest entry lost")
          if not (work / "wheels" / "slimgui-0.8.2-cp312-abi3-win_amd64.whl").is_file():
              raise SystemExit("bundled slimgui wheel lost")

          output.unlink(missing_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(work.rglob("*")):
                  if item.is_file():
                      zf.write(item, item.relative_to(work).as_posix())

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          sha_file.write_text(f"{digest}  {output.name}\n", encoding="utf-8")
          print(f"Built {output} ({output.stat().st_size} bytes)")
          print(f"SHA256 {digest}")
          '@ | Set-Content -Path $script -Encoding UTF8
          python $script

      - name: Blender 5.2 clean install and Sculpt truth gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path "$PWD/manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v6.zip").Path

          foreach ($version in @('5.2.0', '5.2.2')) {
            $archive = Join-Path $env:RUNNER_TEMP "blender-$version-windows-x64.zip"
            $blenderRoot = Join-Path $env:RUNNER_TEMP "blender-$version"
            if (Test-Path $blenderRoot) { Remove-Item $blenderRoot -Recurse -Force }
            curl.exe -L --fail --retry 3 --retry-delay 2 "https://download.blender.org/release/Blender5.2/blender-$version-windows-x64.zip" -o $archive
            if ($LASTEXITCODE -ne 0) { throw "Blender $version download failed" }
            Expand-Archive -Path $archive -DestinationPath $blenderRoot -Force
            $exe = Get-ChildItem -Path $blenderRoot -Filter blender.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Blender $version executable not found" }

            & $exe.FullName --command extension validate $package
            if ($LASTEXITCODE -ne 0) { throw "Blender $version extension validation failed" }

            $cleanRoot = Join-Path $env:RUNNER_TEMP "lumafold-v6-$version"
            $cleanConfig = Join-Path $cleanRoot "config"
            $cleanExtensions = Join-Path $cleanRoot "extensions"
            $localRepo = Join-Path $cleanRoot "repo"
            if (Test-Path $cleanRoot) { Remove-Item $cleanRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $cleanConfig -Force | Out-Null
            New-Item -ItemType Directory -Path $cleanExtensions -Force | Out-Null
            New-Item -ItemType Directory -Path $localRepo -Force | Out-Null
            Copy-Item $package (Join-Path $localRepo 'lumafold-0.8.49.zip') -Force
            & $exe.FullName --command extension server-generate --repo-dir $localRepo --html
            if ($LASTEXITCODE -ne 0) { throw "repo generation failed" }

            $env:BLENDER_USER_CONFIG = $cleanConfig
            $indexPath = (Resolve-Path (Join-Path $localRepo 'index.json')).Path
            $repoUrl = ([System.Uri]::new($indexPath)).AbsoluteUri
            & $exe.FullName --online-mode --command extension repo-add lumafold_ci --clear-all --name 'LumaFold CI' --directory $cleanExtensions --url $repoUrl --source USER
            if ($LASTEXITCODE -ne 0) { throw "repo-add failed" }
            & $exe.FullName --online-mode --command extension install -s -e lumafold
            if ($LASTEXITCODE -ne 0) { throw "clean install failed" }

            $installed = Join-Path $cleanExtensions 'lumafold'
            $probe = Join-Path $env:RUNNER_TEMP "probe-mode-truth-$version.py"
            @"
          import pathlib
          import sys
          import bpy

          root = pathlib.Path(r'''$installed''').resolve()
          sys.path.insert(0, str(root.parent))

          bpy.ops.mesh.primitive_uv_sphere_add()
          bpy.ops.object.mode_set(mode='SCULPT')

          from lumafold.services.blender import BlenderContextService
          snap = BlenderContextService.snapshot(host_id='embedded')
          assert snap.mode == 'SCULPT', f'embedded truth={snap.mode!r}'

          from lumafold.runtime import satellite_bridge_authority as authority
          sat_mode = authority._context_mode(bpy.context)
          assert sat_mode == 'SCULPT', f'satellite truth={sat_mode!r}'
          print('LUMAFOLD_MODE_TRUTH_OK', snap.mode, sat_mode)
          "@ | Set-Content -Path $probe -Encoding UTF8

            & $exe.FullName --background --factory-startup --python $probe
            if ($LASTEXITCODE -ne 0) { throw "Blender $version Sculpt mode truth probe failed" }

            Remove-Item Env:BLENDER_USER_CONFIG -ErrorAction SilentlyContinue
          }

      - name: Publish verified V6 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'LumaFold Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v6.zip
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v6.zip.sha256.txt
          git commit -m "candidate: prefer active Sculpt object for Blender mode truth"
          git push origin HEAD:main
