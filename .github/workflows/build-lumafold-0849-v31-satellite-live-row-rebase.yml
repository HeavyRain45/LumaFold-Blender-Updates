name: Build LumaFold 0.8.49 V31 Satellite Live Row Rebase

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-lumafold-0849-v31-satellite-live-row-rebase.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Patch V30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = Join-Path $env:RUNNER_TEMP 'v31.py'
          @'
          import pathlib, zipfile, shutil, hashlib, os

          root = pathlib.Path.cwd()
          src = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v30-satellite-quick-rows-resize.zip'
          out = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v31-satellite-live-row-rebase.zip'
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'lf_v31'
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          with zipfile.ZipFile(src) as z:
              z.extractall(work)

          runtime = work/'desktop/satellite_host_runtime.py'
          r = runtime.read_text(encoding='utf-8').replace('\r\n','\n')

          old = '''def _queue_quick_rows(rows):
              global _pending_quick_rows, _primary_resize_pending
              rows = clamp_quick_rows(rows)
              _pending_quick_rows = rows
              _primary_resize_pending = True
              actions.put({"action": "command", "command_id": "sculpt.brush.set_quick_rows", "kwargs": {"rows": rows}})
          '''

          new = '''def _queue_quick_rows(rows):
              """Queue a row change using the currently visible native client as truth.

              Startup/preflight geometry is useful for first show, but a live Satellite
              row switch must not depend on an old calibration. The current client size
              is already user-verified for the current row count, so normalize that
              exact size back to the canonical 2-row base before applying the new rows
              on the next frame.
              """
              global _pending_quick_rows, _primary_resize_pending
              global _primary_geometry_ready, _primary_width_design, _primary_base_height_design

              rows = clamp_quick_rows(rows)
              current_rows = clamp_quick_rows(local_sculpt.get("quick_rows", 2))

              if hwnd_main:
                  try:
                      cr = wintypes.RECT()
                      if user32.GetClientRect(hwnd_main, ctypes.byref(cr)):
                          cw = max(1, int(cr.right - cr.left))
                          ch = max(1, int(cr.bottom - cr.top))
                          scale = max(0.01, float(current_scale))
                          width_design = float(cw) / scale
                          current_height_design = float(ch) / scale
                          _primary_width_design = width_design
                          _primary_base_height_design = normalize_base_height_design(
                              current_height_design,
                              rows=current_rows,
                              width_design=width_design,
                          )
                          _primary_geometry_ready = True
                  except Exception:
                      pass

              _pending_quick_rows = rows
              _primary_resize_pending = True
              actions.put({"action": "command", "command_id": "sculpt.brush.set_quick_rows", "kwargs": {"rows": rows}})
          '''

          if old not in r:
              raise SystemExit('V30 quick-row queue block not found')
          r = r.replace(old, new, 1)

          compile(r, str(runtime), 'exec')
          runtime.write_text(r, encoding='utf-8', newline='\n')

          # ==============================================================
          # Regression gates
          # ==============================================================
          foundation = (work/'ui/sculpt_view_foundation.py').read_text(encoding='utf-8')
          view = (work/'ui/sculpt_view.py').read_text(encoding='utf-8')
          session = (work/'desktop/secondary_surface_session.py').read_text(encoding='utf-8')
          secondary = (work/'desktop/secondary_surface_host.py').read_text(encoding='utf-8')
          nav = (work/'runtime/sculpt_navigation.py').read_text(encoding='utf-8')
          pointer = (work/'runtime/sculpt_native_pointer.py').read_text(encoding='utf-8')
          mask = (work/'runtime/sculpt_mask_gesture.py').read_text(encoding='utf-8')
          route = (work/'runtime/sculpt_route_truth.py').read_text(encoding='utf-8')
          sat = (work/'desktop/satellite_host.py').read_text(encoding='utf-8')

          # V31 live row rebase.
          qstart = r.index('def _queue_quick_rows(rows):')
          qend = r.index('\n\ndef _secondary_log_path', qstart)
          qb = r[qstart:qend]
          assert 'current_rows = clamp_quick_rows(local_sculpt.get("quick_rows", 2))' in qb
          assert 'user32.GetClientRect(hwnd_main' in qb
          assert '_primary_base_height_design = normalize_base_height_design(' in qb
          assert 'rows=current_rows' in qb
          assert '_primary_geometry_ready = True' in qb
          assert '_pending_quick_rows = rows' in qb
          assert '_primary_resize_pending = True' in qb

          # Next-frame resize still happens before frame dimensions are read.
          draw_start = r.index('def _draw_frame():')
          draw = r[draw_start:draw_start+2600]
          assert draw.index('_commit_pending_primary_surface()') < draw.index('GetClientRect(hwnd_main')
          assert 'set_exact_client_size(hwnd_main, target_w, target_h)' in r
          assert '_apply_rounded_window_region(hwnd_main)' in r

          # V30 dedicated layout metric stays separated from popup anchor.
          assert 'surface_state["sculpt_primary_bottom_anchor"] = dict(brush_anchor)' in foundation
          assert 'surface_state.get("sculpt_primary_bottom_anchor")' in r

          # V29 popup/open behavior stays frozen.
          assert 'def _toggle_secondary_surface(kind="brush_library", anchor=None, *, open_only=False):' in r
          assert '_toggle_secondary_surface(kind, anchor, open_only=True)' in r
          assert 'runtime._toggle_secondary_surface(kind, anchor, open_only=True)' in session
          block_start = foundation.index('brush_library_clicked = button(imgui, "笔刷库"')
          block_end = foundation.index('imgui.same_line(spacing=bottom_gap)', block_start)
          anchor_block = foundation[block_start:block_end]
          assert anchor_block.index('if brush_library_clicked:') < anchor_block.index('surface_state["sculpt_brush_library_anchor"]')

          # V27 first-click behavior remains.
          assert 'pressed_preview = False' in view
          assert 'imgui_arg.is_mouse_clicked(0)' in view
          assert '_open_targeted_library(int(ident)' in view

          # V28 native Shift snap path stays frozen.
          assert 'def invoke_blender_rotate(target) -> bool:' in nav
          assert 'AXIS_SNAP_ENABLE' in nav and 'AXIS_SNAP_DISABLE' in nav
          assert 'LEFT_SHIFT' in nav and 'RIGHT_SHIFT' in nav
          assert 'getattr(navigation, "invoke_blender_rotate", None)' in pointer
          assert 'bpy.ops.view3d.rotate("INVOKE_DEFAULT")' not in pointer

          # Preserve preview / Mask / Satellite first-stroke chain.
          assert 'on_request_preview=_request_brush_previews_exact' in secondary
          assert '_BRUSH_PREVIEW_QUEUE_LIMIT = 4' in secondary
          assert 'clean_age >= 0.18' in secondary
          assert '_CLASSES = (LUMAFOLD_OT_sculpt_mask_gesture_v2,)' in mask
          assert 'mask_feather_tap' in mask
          assert 'mask_sharpen_tap' in mask
          assert 'background_invert_tap' in mask
          assert 'satellite_pointer_guard' in route
          assert 'satellite_client_pointer_reprime' in sat
          assert '_restore_blender_foreground_if_satellite_activated()' in sat
          assert '_mirror_quick_shortcut_selection()' in sat

          for py in work.rglob('*.py'):
              compile(py.read_text(encoding='utf-8'), str(py), 'exec')

          out.unlink(missing_ok=True)
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for file in sorted(work.rglob('*')):
                  if file.is_file():
                      z.write(file, file.relative_to(work).as_posix())

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_suffix(out.suffix+'.sha256.txt').write_text(
              f'{digest}  {out.name}\n', encoding='utf-8'
          )
          print('SHA256', digest)
          '@ | Set-Content $py -Encoding UTF8
          python $py

      - name: Blender 5.2.0 and 5.2.2 extension validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Resolve-Path "$PWD/manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v31-satellite-live-row-rebase.zip").Path
          foreach ($v in @('5.2.0','5.2.2')) {
            $z = Join-Path $env:RUNNER_TEMP "blender-$v.zip"
            $d = Join-Path $env:RUNNER_TEMP "blender-$v"
            curl.exe -L --fail --retry 3 "https://download.blender.org/release/Blender5.2/blender-$v-windows-x64.zip" -o $z
            if ($LASTEXITCODE -ne 0) { throw "Blender $v download failed" }
            Expand-Archive $z $d -Force
            $exe = Get-ChildItem $d -Filter blender.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Blender $v executable missing" }
            & $exe.FullName --command extension validate $pkg
            if ($LASTEXITCODE -ne 0) { throw "Blender $v validation failed" }
          }

      - name: Publish
        shell: pwsh
        run: |
          git config user.name 'LumaFold Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v31-satellite-live-row-rebase.zip*
          git commit -m "candidate: rebase Satellite row resize from live client size"
          git push origin HEAD:main
