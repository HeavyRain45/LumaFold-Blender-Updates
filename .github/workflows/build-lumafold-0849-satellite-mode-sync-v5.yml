name: Build LumaFold 0.8.49 Satellite Mode Sync V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lumafold-0849-satellite-mode-sync-v5.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Patch V4 candidate with Satellite mode-sync fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'patch_v5.py'
          @'
          import hashlib
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path.cwd()
          source = root / "manual" / "candidates" / "lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v4.zip"
          output = root / "manual" / "candidates" / "lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v5.zip"
          sha_file = output.with_suffix(output.suffix + ".sha256.txt")
          work = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "lumafold_v5_stage"

          if not source.is_file():
              raise SystemExit(f"source candidate missing: {source}")
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          with zipfile.ZipFile(source, "r") as zf:
              zf.extractall(work)

          # 1) Satellite mode commands arrive through Blender's bridge timer, not
          # inside the Embedded ImGui draw frame. Execute only those mode commands
          # synchronously so no second Blender timer is left pending after the
          # Satellite button click.
          sculpt_core = work / "runtime" / "sculpt_input_core.py"
          text = sculpt_core.read_text(encoding="utf-8").replace("\r\n", "\n")
          marker = '''        try:
              bpy.app.timers.register(run, first_interval=0.01)
          except Exception:
              run()
          return label + " · 已请求"
          '''
          replacement = '''        if _host_mode() == "satellite":
              # Satellite commands are already dispatched on Blender's main-thread
              # bridge timer, so deferring again creates a stale window where Blender
              # has not committed the mode yet but the child already rendered the
              # old UI. Complete this one mode transition in the current bridge tick.
              run()
              return str(state.get("mode_request_status") or (label + " · 完成"))

          try:
              bpy.app.timers.register(run, first_interval=0.01)
          except Exception:
              run()
          return label + " · 已请求"
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"Satellite mode queue marker count={text.count(marker)}")
          text = text.replace(marker, replacement, 1)
          sculpt_core.write_text(text, encoding="utf-8", newline="\n")

          # 2) Ordinary Satellite commands remain snapshot-free for first-stroke
          # latency. Only mode enter/exit returns one committed state snapshot so
          # the child immediately swaps its Object/Sculpt product surface.
          bridge = work / "desktop" / "bridge_server.py"
          btext = bridge.read_text(encoding="utf-8").replace("\r\n", "\n")
          old = '''            # Satellite already applies the requested UI state locally. Avoid
              # a redundant full Blender snapshot on every Satellite click; that
              # snapshot runs Brush/Alpha sync on Blender's main thread.
              if not satellite_client:
                  response["state"] = self._snapshot(self.client_name)
              return response
          '''
          new = '''            # Satellite already applies ordinary requested UI state locally.
              # Keep those writes snapshot-free for first-stroke latency. Mode
              # transitions are different: the child cannot infer Blender truth,
              # so return exactly one committed snapshot after synchronous enter/exit.
              if (not satellite_client) or command_id in {"sculpt.enter", "sculpt.exit_to_object"}:
                  response["state"] = self._snapshot(self.client_name)
              return response
          '''
          if btext.count(old) != 1:
              raise SystemExit(f"bridge command response marker count={btext.count(old)}")
          btext = btext.replace(old, new, 1)
          bridge.write_text(btext, encoding="utf-8", newline="\n")

          # Syntax gates for touched files.
          compile(sculpt_core.read_text(encoding="utf-8"), str(sculpt_core), "exec")
          compile(bridge.read_text(encoding="utf-8"), str(bridge), "exec")

          # Preserve all already-accepted V3/V4 boundaries.
          panels = (work / "panels.py").read_text(encoding="utf-8")
          if 'row.menu("LUMAFOLD_MT_product_maintenance"' in panels:
              raise SystemExit("hidden top-right dropdown regressed")
          satellite = (work / "desktop" / "satellite_host.py").read_text(encoding="utf-8")
          handoff_slice = satellite[satellite.index("def _wndproc_with_shortcut_capture"):satellite.index("if int(msg) == int(_runtime.WM_APP_SHOW)")]
          if '_runtime.actions.put({"action": "get_state"})' in handoff_slice:
              raise SystemExit("V3 Satellite first-stroke bounded fix regressed")
          if "awaiting_grant = False" not in satellite:
              raise SystemExit("Satellite handoff reconcile lost")
          launcher = (work / "desktop" / "launcher.py").read_text(encoding="utf-8")
          if "_active_slimgui_import_root" not in launcher:
              raise SystemExit("bundled Satellite runtime launch fix lost")
          manifest = (work / "blender_manifest.toml").read_text(encoding="utf-8")
          if 'wheels/slimgui-0.8.2-cp312-abi3-win_amd64.whl' not in manifest:
              raise SystemExit("bundled slimgui manifest entry lost")
          if not (work / "wheels" / "slimgui-0.8.2-cp312-abi3-win_amd64.whl").is_file():
              raise SystemExit("bundled slimgui wheel lost")

          output.unlink(missing_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(work.rglob("*")):
                  if item.is_file():
                      zf.write(item, item.relative_to(work).as_posix())

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          sha_file.write_text(f"{digest}  {output.name}\n", encoding="utf-8")
          print(f"Built {output} ({output.stat().st_size} bytes)")
          print(f"SHA256 {digest}")
          '@ | Set-Content -Path $script -Encoding UTF8
          python $script

      - name: Blender 5.2 clean install gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path "$PWD/manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v5.zip").Path

          foreach ($version in @('5.2.0', '5.2.2')) {
            $archive = Join-Path $env:RUNNER_TEMP "blender-$version-windows-x64.zip"
            $blenderRoot = Join-Path $env:RUNNER_TEMP "blender-$version"
            if (Test-Path $blenderRoot) { Remove-Item $blenderRoot -Recurse -Force }
            curl.exe -L --fail --retry 3 --retry-delay 2 "https://download.blender.org/release/Blender5.2/blender-$version-windows-x64.zip" -o $archive
            if ($LASTEXITCODE -ne 0) { throw "Blender $version download failed" }
            Expand-Archive -Path $archive -DestinationPath $blenderRoot -Force
            $exe = Get-ChildItem -Path $blenderRoot -Filter blender.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Blender $version executable not found" }

            & $exe.FullName --command extension validate $package
            if ($LASTEXITCODE -ne 0) { throw "Blender $version extension validation failed" }

            $cleanRoot = Join-Path $env:RUNNER_TEMP "lumafold-v5-$version"
            $cleanConfig = Join-Path $cleanRoot "config"
            $cleanExtensions = Join-Path $cleanRoot "extensions"
            $localRepo = Join-Path $cleanRoot "repo"
            if (Test-Path $cleanRoot) { Remove-Item $cleanRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $cleanConfig -Force | Out-Null
            New-Item -ItemType Directory -Path $cleanExtensions -Force | Out-Null
            New-Item -ItemType Directory -Path $localRepo -Force | Out-Null
            Copy-Item $package (Join-Path $localRepo 'lumafold-0.8.49.zip') -Force
            & $exe.FullName --command extension server-generate --repo-dir $localRepo --html
            if ($LASTEXITCODE -ne 0) { throw "repo generation failed" }

            $env:BLENDER_USER_CONFIG = $cleanConfig
            $indexPath = (Resolve-Path (Join-Path $localRepo 'index.json')).Path
            $repoUrl = ([System.Uri]::new($indexPath)).AbsoluteUri
            & $exe.FullName --online-mode --command extension repo-add lumafold_ci --clear-all --name 'LumaFold CI' --directory $cleanExtensions --url $repoUrl --source USER
            if ($LASTEXITCODE -ne 0) { throw "repo-add failed" }
            & $exe.FullName --online-mode --command extension install -s -e lumafold
            if ($LASTEXITCODE -ne 0) { throw "clean install failed" }
            Remove-Item Env:BLENDER_USER_CONFIG -ErrorAction SilentlyContinue
          }

      - name: Publish verified V5 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'LumaFold Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v5.zip
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v5.zip.sha256.txt
          git commit -m "candidate: synchronize committed Sculpt mode back to Satellite"
          git push origin HEAD:main
