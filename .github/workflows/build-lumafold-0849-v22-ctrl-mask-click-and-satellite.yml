name: Build LumaFold 0.8.49 V22 Ctrl Mask Click + Satellite

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-lumafold-0849-v22-ctrl-mask-click-and-satellite.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Patch V21 Ctrl Mask click + Satellite first-stroke ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = Join-Path $env:RUNNER_TEMP 'v22.py'
          @'
          import pathlib, zipfile, shutil, hashlib, os

          root = pathlib.Path.cwd()
          src = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v21-ctrl-mask-handoff.zip'
          out = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v22-ctrl-mask-click-satellite.zip'
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'lf_v22'
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          with zipfile.ZipFile(src) as z:
              z.extractall(work)

          # --------------------------------------------------------------
          # A) Satellite can miss the standalone Ctrl keydown before the first
          #    pen press. Make the LMB route self-heal the Ctrl Mask session
          #    from event.ctrl truth, so Blender's default Ctrl=invert sculpt
          #    never steals the first stroke.
          # --------------------------------------------------------------
          tool = work/'runtime/sculpt_mask_tool_bridge.py'
          t = tool.read_text(encoding='utf-8').replace('\r\n','\n')

          start = t.index('def surface_brush_handoff_begin(context=None) -> bool:')
          end = t.index('\ndef surface_brush_handoff_end', start)
          new_begin = (
              'def surface_brush_handoff_begin(context=None) -> bool:\n'
              '    """Expose the saved brush WorkSpaceTool for native Mask brush poll.\n'
              '\n'
              '    Event.ctrl is authoritative here. Satellite focus handoff can miss the\n'
              '    standalone Ctrl keydown event before the first pen press, so this path\n'
              '    repairs the temporary Mask session synchronously on that first LMB.\n'
              '    """\n'
              '    workspace = _workspace(context)\n'
              '    if workspace is None:\n'
              '        return False\n'
              '    state = _state(workspace)\n'
              '    state["ctrl_held"] = True\n'
              '\n'
              '    if not state.get("session_active"):\n'
              '        info = session_begin(context)\n'
              '        state = _state(workspace)\n'
              '        if not bool(info.get("session_active")) or not state.get("session_active"):\n'
              '            _trace(\n'
              '                "ctrl_mask_surface_self_heal_failed",\n'
              '                active_tool=_active_tool_id(workspace),\n'
              '                base_tool=str(state.get("base_tool") or ""),\n'
              '            )\n'
              '            return False\n'
              '        _trace(\n'
              '            "ctrl_mask_surface_self_healed",\n'
              '            mask_tool=str(state.get("session_tool") or ""),\n'
              '            restore_tool=str(state.get("restore_tool") or ""),\n'
              '        )\n'
              '\n'
              '    restore_tool = str(state.get("restore_tool") or state.get("base_tool") or "")\n'
              '    if not restore_tool or restore_tool in MASK_TOOL_IDS:\n'
              '        return False\n'
              '    active_id = _active_tool_id(workspace)\n'
              '    if active_id == restore_tool:\n'
              '        return True\n'
              '    if _set_tool(context, restore_tool):\n'
              '        _trace(\n'
              '            "ctrl_mask_surface_brush_handoff_begin",\n'
              '            tool=restore_tool,\n'
              '            mask_tool=str(state.get("session_tool") or ""),\n'
              '        )\n'
              '        return True\n'
              '    _trace(\n'
              '        "ctrl_mask_surface_brush_handoff_failed",\n'
              '        tool=restore_tool,\n'
              '        mask_tool=str(state.get("session_tool") or ""),\n'
              '    )\n'
              '    return False\n'
              '\n'
              '\n'
          )
          t = t[:start] + new_begin + t[end:]
          compile(t, str(tool), 'exec')
          tool.write_text(t, encoding='utf-8', newline='\n')

          # --------------------------------------------------------------
          # B) Reuse the existing intent modal only for Blender-confirmed
          #    background presses:
          #      Ctrl + background TAP  -> native mask flood INVERT
          #      Ctrl + background DRAG -> remembered native Mask gesture tool
          #    Surface presses still go straight to native Mask brush on PRESS.
          # --------------------------------------------------------------
          gesture = work/'runtime/sculpt_mask_gesture.py'
          g = gesture.read_text(encoding='utf-8').replace('\r\n','\n')

          if 'from bpy.props import BoolProperty\n' not in g:
              anchor = 'import bpy\n'
              if anchor not in g:
                  raise SystemExit('bpy import anchor missing')
              g = g.replace(anchor, anchor + 'from bpy.props import BoolProperty\n', 1)

          cls = g.index('class LUMAFOLD_OT_sculpt_mask_gesture_v2')
          poll = g.index('    @classmethod\n    def poll', cls)
          class_head = g[cls:poll]
          prop = '    background_only: BoolProperty(default=False, options={"SKIP_SAVE"})\n\n'
          if 'background_only: BoolProperty' not in class_head:
              insert = g.index('    bl_options = {"INTERNAL"}\n', cls) + len('    bl_options = {"INTERNAL"}\n')
              g = g[:insert] + '\n' + prop + g[insert:]

          invoke = g.index('    def invoke(self, context, event):', cls)
          modal = g.index('\n    def modal(self, context, event):', invoke)
          invoke_block = g[invoke:modal]
          old_surface = '        self._start_on_surface = bool(_drag_hits_active_surface(context, event))\n'
          new_surface = (
              '        self._start_on_surface = (\n'
              '            False\n'
              '            if bool(self.background_only)\n'
              '            else bool(_drag_hits_active_surface(context, event))\n'
              '        )\n'
          )
          if old_surface not in invoke_block:
              raise SystemExit('mask intent surface-classifier line missing')
          invoke_block = invoke_block.replace(old_surface, new_surface, 1)
          g = g[:invoke] + invoke_block + g[modal:]

          # Replace V21 direct background gesture with a background tap/drag
          # classifier, and fail closed (consume Ctrl+LMB) so Blender's default
          # inverted sculpt keymap cannot steal a failed first Satellite attempt.
          hp_start = g.index('def handle_pointer_press(context, event, target):')
          hp_end = g.index('\ndef install(', hp_start)
          new_handle = (
              'def handle_pointer_press(context, event, target):\n'
              '    if str(getattr(event, "type", "") or "").upper() != "LEFTMOUSE":\n'
              '        return None\n'
              '    if str(getattr(event, "value", "") or "").upper() != "PRESS":\n'
              '        return None\n'
              '    if not bool(getattr(event, "ctrl", False)) or bool(getattr(event, "shift", False)):\n'
              '        return None\n'
              '    if target is None:\n'
              '        return True\n'
              '\n'
              '    begin = getattr(_TOOL_BRIDGE, "surface_brush_handoff_begin", None) if _TOOL_BRIDGE is not None else None\n'
              '    end = getattr(_TOOL_BRIDGE, "surface_brush_handoff_end", None) if _TOOL_BRIDGE is not None else None\n'
              '    window, area, region = target\n'
              '    invert = bool(getattr(event, "alt", False))\n'
              '\n'
              '    try:\n'
              '        with bpy.context.temp_override(window=window, area=area, region=region):\n'
              '            routed_context = bpy.context\n'
              '\n'
              '            if not callable(begin) or not bool(begin(routed_context)):\n'
              '                # Do not leak Ctrl+LMB to Blender\'s default inverted-sculpt\n'
              '                # keymap. A failed LumaFold Mask handoff is swallowed and traced.\n'
              '                _trace("ctrl_mask_brush_handoff_blocked", routed_context, event)\n'
              '                return True\n'
              '\n'
              '            try:\n'
              '                sculpt_result = _native_mask_stroke(routed_context, invert)\n'
              '            finally:\n'
              '                if callable(end):\n'
              '                    end(routed_context)\n'
              '\n'
              '            if "RUNNING_MODAL" in sculpt_result or "FINISHED" in sculpt_result:\n'
              '                _trace(\n'
              '                    "surface_mask_native_brush_owned", routed_context, event,\n'
              '                    result=sorted(sculpt_result),\n'
              '                )\n'
              '                return True\n'
              '\n'
              '            if "PASS_THROUGH" in sculpt_result:\n'
              '                # Blender itself proved this was background. Keep this\n'
              '                # original press alive only long enough to distinguish a\n'
              '                # click from a drag. Click=invert all; drag=native tool.\n'
              '                result = set(\n'
              '                    bpy.ops.lumafold.sculpt_mask_gesture_v2(\n'
              '                        "INVOKE_DEFAULT",\n'
              '                        background_only=True,\n'
              '                    )\n'
              '                    or ()\n'
              '                )\n'
              '                ok = "RUNNING_MODAL" in result\n'
              '                _trace(\n'
              '                    "background_mask_intent_started" if ok else "background_mask_intent_failed",\n'
              '                    routed_context, event, result=sorted(result),\n'
              '                )\n'
              '                return True\n'
              '\n'
              '            # CANCELLED/error is not background. Consume the Ctrl press so\n'
              '            # native inverted sculpt cannot become an accidental fallback.\n'
              '            _trace(\n'
              '                "ctrl_mask_native_brush_failed_closed", routed_context, event,\n'
              '                result=sorted(sculpt_result),\n'
              '            )\n'
              '            return True\n'
              '    except (RuntimeError, TypeError, AttributeError) as exc:\n'
              '        _trace(\n'
              '            "ctrl_mask_handoff_exception_closed", context, event,\n'
              '            error=f"{type(exc).__name__}: {exc}",\n'
              '        )\n'
              '        return True\n'
              '\n'
              '\n'
          )
          g = g[:hp_start] + new_handle + g[hp_end:]
          compile(g, str(gesture), 'exec')
          gesture.write_text(g, encoding='utf-8', newline='\n')

          # --------------------------------------------------------------
          # Gates.
          # --------------------------------------------------------------
          route = (work/'runtime/sculpt_route_truth.py').read_text(encoding='utf-8')
          sat = (work/'desktop/satellite_host.py').read_text(encoding='utf-8')
          sat_rt = (work/'desktop/satellite_host_runtime.py').read_text(encoding='utf-8')
          secondary = (work/'desktop/secondary_surface_host.py').read_text(encoding='utf-8')
          bridge = (work/'desktop/bridge_server.py').read_text(encoding='utf-8')

          # New Ctrl behavior.
          assert 'ctrl_mask_surface_self_healed' in t
          assert 'state["ctrl_held"] = True' in new_begin
          assert 'background_only: BoolProperty' in g
          assert 'background_only=True' in g
          assert 'background_invert_tap' in g
          assert '_run_mask_flood(context, "INVERT")' in g
          assert 'background_native_mask_handoff' in g
          assert 'ctrl_mask_native_brush_failed_closed' in g
          assert 'return True' in new_handle
          assert 'brush_toggle="MASK"' in g
          assert 'ignore_background_click=True' in g
          assert 'if event_type == "LEFTMOUSE" and ctrl and _MASK_GESTURE is not None:' in route

          # V21/V17 accepted behavior stays intact.
          assert '_restore_blender_foreground_if_satellite_activated()' in sat
          assert '_mirror_quick_shortcut_selection()' in sat
          assert 'host_switch_hit_test(x, y)' in sat
          assert 'if key == "brush_preview_cache":' in sat_rt
          assert 'sculpt.brush.library_replace_slot' in secondary
          assert 'def _sculpt_visual_state(self):' in bridge

          for f in work.rglob('*.py'):
              compile(f.read_text(encoding='utf-8'), str(f), 'exec')

          out.unlink(missing_ok=True)
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for f in sorted(work.rglob('*')):
                  if f.is_file():
                      z.write(f, f.relative_to(work).as_posix())

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_suffix(out.suffix+'.sha256.txt').write_text(
              f'{digest}  {out.name}\n', encoding='utf-8'
          )
          print('SHA256', digest)
          '@ | Set-Content $py -Encoding UTF8
          python $py

      - name: Blender 5.2.0 and 5.2.2 extension validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Resolve-Path "$PWD/manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v22-ctrl-mask-click-satellite.zip").Path
          foreach ($v in @('5.2.0','5.2.2')) {
            $z = Join-Path $env:RUNNER_TEMP "blender-$v.zip"
            $d = Join-Path $env:RUNNER_TEMP "blender-$v"
            curl.exe -L --fail --retry 3 "https://download.blender.org/release/Blender5.2/blender-$v-windows-x64.zip" -o $z
            if ($LASTEXITCODE -ne 0) { throw "Blender $v download failed" }
            Expand-Archive $z $d -Force
            $exe = Get-ChildItem $d -Filter blender.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Blender $v executable missing" }
            & $exe.FullName --command extension validate $pkg
            if ($LASTEXITCODE -ne 0) { throw "Blender $v validation failed" }
          }

      - name: Publish
        shell: pwsh
        run: |
          git config user.name 'LumaFold Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v22-ctrl-mask-click-satellite.zip*
          git commit -m "candidate: restore Ctrl background invert and harden Satellite first Mask stroke"
          git push origin HEAD:main
