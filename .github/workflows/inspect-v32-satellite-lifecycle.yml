name: Inspect V32 Satellite Lifecycle

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-v32-satellite-lifecycle.yml']

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect V32 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $py = Join-Path $env:RUNNER_TEMP 'inspect_v32.py'
          @'
          import pathlib, zipfile, tempfile, sys
          sys.stdout.reconfigure(encoding='utf-8', errors='backslashreplace')
          root = pathlib.Path.cwd()
          src = root/'manual/candidates/lumafold-0.8.49-self-contained-satellite-first-stroke-hotfix-v32-preserve-hidden-quick-brushes.zip'
          work = pathlib.Path(tempfile.mkdtemp(prefix='v32inspect_'))
          with zipfile.ZipFile(src) as z:
              z.extractall(work)

          specs = {
              'desktop/satellite_host_runtime.py': [
                  'def _sync_local_from_snapshot',
                  'def network_worker',
                  'def _queue_state_change',
                  'def _queue_command',
                  'def _queue_quick_rows',
                  'def _draw_frame',
              ],
              'desktop/satellite_host.py': [
                  'def _network_worker_after_first_render',
                  'def _sync_product_extras',
                  'def _sync_local_from_snapshot',
                  'def _draw_sculpt_compact_with_more',
              ],
              'desktop/bridge_server.py': [
                  'def _process',
                  'command_id',
                  '_sculpt_visual_state',
              ],
              'runtime/satellite_bridge_authority.py': [
                  'def _enforce_satellite_wire_truth',
                  'def process_wrapper',
                  'command',
                  '_satellite_snapshot',
              ],
              'ui/sculpt_view.py': [
                  'on_assign_current_to_slot',
                  'def _quick_widget',
                  'empty',
              ],
              'ui/sculpt_view_foundation.py': [
                  'on_assign_current_to_slot',
                  'empty',
                  'quick_slot',
              ],
              'desktop/primary_geometry_session.py': [
                  'def ',
              ],
          }

          for rel, marks in specs.items():
              p = work/rel
              text = p.read_text(encoding='utf-8', errors='replace')
              print('\n===== FILE', rel, '=====')
              lines = text.splitlines()
              spans = []
              for mark in marks:
                  for i,line in enumerate(lines):
                      if mark in line:
                          spans.append((max(0,i-25), min(len(lines),i+85), mark))
              # Merge nearby ranges.
              spans.sort()
              merged=[]
              for a,b,m in spans:
                  if not merged or a > merged[-1][1] + 5:
                      merged.append([a,b,[m]])
                  else:
                      merged[-1][1]=max(merged[-1][1],b)
                      merged[-1][2].append(m)
              for a,b,ms in merged:
                  print('\n---', ', '.join(dict.fromkeys(ms)), f'lines {a+1}-{b}', '---')
                  for j in range(a,b):
                      print(f'{j+1:04d}: {lines[j]}')
          '@ | Set-Content $py -Encoding UTF8
          python $py
